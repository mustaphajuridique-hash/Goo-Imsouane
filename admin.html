<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Goo’Imsouane Admin</title>
<style>
:root{--navy:#0b3a5b;--lime:#9ad41c;--sun:#f5d130;--bg:#f3f7f9;--card:#fff;--ink:#0d2233;--mute:#58707f;--line:#dbe5ea;--bad:#c0392b}
@media (prefers-color-scheme:dark){:root{--bg:#071a28;--card:#0d2b42;--ink:#eaf3f8;--mute:#9bb4c3;--line:#1a415e}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 60px}
header{background:var(--navy);color:#fff;padding:16px;margin-bottom:16px}
header b{font-size:19px}header span{color:var(--sun);margin-left:6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
h2{margin:0 0 12px;font-size:18px}
label{display:block;font-weight:600;font-size:14px;margin:10px 0 4px}
input,select,textarea,button{font:inherit}
input,select,textarea{width:100%;padding:11px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
textarea{min-height:80px}
button{border:0;border-radius:12px;padding:13px 16px;font-weight:700;cursor:pointer}
.go{background:var(--lime);color:#0b2a12;width:100%;margin-top:14px}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tabs button{flex:1;background:var(--card);border:1.5px solid var(--line);color:var(--ink)}
.tabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.msg{padding:10px 12px;border-radius:10px;margin-top:12px;font-size:14px;display:none}
.msg.ok{background:#e2f5c7;color:#1d3a05;display:block}.msg.err{background:#fde0dc;color:var(--bad);display:block}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bk{border-top:1px solid var(--line);padding:12px 0}.bk:first-child{border-top:0}
.bk small{color:var(--mute);display:block}
.bk .acts{display:flex;gap:8px;margin-top:8px}.bk .acts button{padding:8px 12px;font-size:13px;background:var(--bg);border:1.5px solid var(--line);color:var(--ink)}
.hid{display:none}
.prev{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.prev img{width:64px;height:64px;object-fit:cover;border-radius:8px}
</style>
</head>
<body>
<header><div class="wrap" style="padding:0"><b>Goo’</b><span>imsouane admin</span></div></header>
<div class="wrap">

<div id="login" class="card">
  <h2>Sign in</h2>
  <label for="em">Email</label><input id="em" type="email" autocomplete="username">
  <label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password">
  <button class="go" id="btnLogin">Sign in</button>
  <div class="msg" id="mLogin"></div>
</div>

<div id="panel" class="hid">
  <div class="tabs" role="tablist">
    <button data-t="v" class="on">Vendor</button>
    <button data-t="l">Listing</button>
    <button data-t="b">Bookings</button>
  </div>

  <div id="tv" class="card">
    <h2>Add a vendor</h2>
    <label for="vn">Business name</label><input id="vn">
    <label for="va">Area</label><input id="va" placeholder="e.g. Imsouane bay">
    <label for="vd">Short description</label><textarea id="vd"></textarea>
    <div class="row"><div><label for="vw">WhatsApp</label><input id="vw" placeholder="+212..."></div>
    <div><label for="ve">Email</label><input id="ve" type="email"></div></div>
    <button class="go" id="btnVendor">Save vendor</button>
    <div class="msg" id="mV"></div>
  </div>

  <div id="tl" class="card hid">
    <h2>Add a listing</h2>
    <label for="lv">Vendor</label><select id="lv"></select>
    <div class="row"><div><label for="lc">Category</label>
      <select id="lc"><option value="stay">Stay</option><option value="surf">Surf</option><option value="food">Food</option><option value="transport">Transport</option><option value="outdoor">Outdoor</option><option value="bundle">Bundle</option></select></div>
    <div><label for="lu">Price per</label>
      <select id="lu"><option value="night">night</option><option value="person">person</option><option value="day">day</option><option value="trip">trip</option></select></div></div>
    <label for="lt">Title</label><input id="lt">
    <label for="ld">Description</label><textarea id="ld"></textarea>
    <label for="li">What’s included (separate with commas)</label><input id="li" placeholder="Breakfast, Board included">
    <div class="row"><div><label for="lp">Price (MAD)</label><input id="lp" type="number" inputmode="numeric" min="1"></div>
    <div><label for="lq">Max quantity</label><input id="lq" type="number" inputmode="numeric" value="10"></div></div>
    <label for="lf">Photos (5 to 8, first one is the cover)</label>
    <input id="lf" type="file" accept="image/*" multiple>
    <div class="prev" id="prev"></div>
    <button class="go" id="btnListing">Save listing</button>
    <div class="msg" id="mL"></div>
  </div>

  <div id="tb" class="card hid"><h2>Bookings</h2><div id="bl">Loading…</div></div>
  <button class="tabs" style="width:100%;background:none;border:0;color:var(--mute);margin-top:8px" id="btnOut">Sign out</button>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const sb=supabase.createClient("https://ngjechhcbgfmwjndotzd.supabase.co","sb_publishable_TQFopyBTIb0Vtl2Ua7boPA_UErNNhv9");
const $=s=>document.querySelector(s);
const say=(el,t,ok)=>{el.textContent=t;el.className="msg "+(ok?"ok":"err")};

async function enter(){
  const {data:{user}}=await sb.auth.getUser();
  if(!user){$("#login").classList.remove("hid");$("#panel").classList.add("hid");return}
  const {data}=await sb.from("admins").select("user_id").eq("user_id",user.id);
  if(!data||!data.length){say($("#mLogin"),"This account is not an admin. Add its user id to the admins table.",false);await sb.auth.signOut();return}
  $("#login").classList.add("hid");$("#panel").classList.remove("hid");loadVendors();
}
$("#btnLogin").onclick=async()=>{
  const {error}=await sb.auth.signInWithPassword({email:$("#em").value.trim(),password:$("#pw").value});
  if(error)say($("#mLogin"),error.message,false);else enter();
};
$("#btnOut").onclick=async()=>{await sb.auth.signOut();enter()};

document.querySelectorAll(".tabs [data-t]").forEach(b=>b.onclick=()=>{
  document.querySelectorAll(".tabs [data-t]").forEach(x=>x.classList.toggle("on",x===b));
  ["v","l","b"].forEach(k=>$("#t"+k).classList.toggle("hid",k!==b.dataset.t));
  if(b.dataset.t==="b")loadBookings();
  if(b.dataset.t==="l")loadVendors();
});

async function loadVendors(){
  const {data}=await sb.from("vendors").select("id,name").order("name");
  $("#lv").innerHTML=(data||[]).map(v=>`<option value="${v.id}">${v.name.replace(/</g,"&lt;")}</option>`).join("");
}
$("#btnVendor").onclick=async()=>{
  const name=$("#vn").value.trim();if(!name)return say($("#mV"),"Business name is required.",false);
  const {error}=await sb.from("vendors").insert({name,area:$("#va").value.trim(),description:$("#vd").value.trim(),whatsapp:$("#vw").value.trim(),email:$("#ve").value.trim()||null});
  if(error)return say($("#mV"),error.message,false);
  say($("#mV"),"Vendor saved. Now add its listings in the Listing tab.",true);
  ["vn","va","vd","vw","ve"].forEach(i=>$("#"+i).value="");
};

// Resize photos in the browser so uploads stay small on mobile data
function shrink(file){return new Promise(res=>{
  const img=new Image(),u=URL.createObjectURL(file);
  img.onload=()=>{const m=1600,r=Math.min(1,m/Math.max(img.width,img.height));
    const c=document.createElement("canvas");c.width=img.width*r;c.height=img.height*r;
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    c.toBlob(b=>{URL.revokeObjectURL(u);res(b)},"image/jpeg",.82)};
  img.src=u;
})}
$("#lf").onchange=e=>{
  $("#prev").innerHTML="";
  [...e.target.files].slice(0,8).forEach(f=>{const i=document.createElement("img");i.src=URL.createObjectURL(f);$("#prev").appendChild(i)});
};
$("#btnListing").onclick=async()=>{
  const btn=$("#btnListing"),m=$("#mL");
  const title=$("#lt").value.trim(),price=parseInt($("#lp").value,10);
  if(!$("#lv").value)return say(m,"Add a vendor first.",false);
  if(!title||!price)return say(m,"Title and price are required.",false);
  btn.disabled=true;say(m,"Saving…",true);
  const {data,error}=await sb.from("listings").insert({
    vendor_id:$("#lv").value,category:$("#lc").value,title,description:$("#ld").value.trim(),
    includes:$("#li").value.split(",").map(s=>s.trim()).filter(Boolean),
    price_mad:price,price_unit:$("#lu").value,max_quantity:parseInt($("#lq").value,10)||10,status:"active"
  }).select("id").single();
  if(error){btn.disabled=false;return say(m,error.message,false)}
  const files=[...$("#lf").files].slice(0,8);
  for(let i=0;i<files.length;i++){
    say(m,`Uploading photo ${i+1} of ${files.length}…`,true);
    const blob=await shrink(files[i]),path=`${data.id}/${Date.now()}-${i}.jpg`;
    const up=await sb.storage.from("listing-photos").upload(path,blob,{contentType:"image/jpeg"});
    if(up.error){btn.disabled=false;return say(m,"Photo upload failed: "+up.error.message,false)}
    await sb.from("listing_photos").insert({listing_id:data.id,path,position:i});
  }
  btn.disabled=false;say(m,"Listing saved and live.",true);
  ["lt","ld","li","lp","lf"].forEach(i=>$("#"+i).value="");$("#prev").innerHTML="";
};

async function loadBookings(){
  const {data,error}=await sb.from("bookings").select("*,listings(title),vendors(name)").order("created_at",{ascending:false}).limit(50);
  if(error){$("#bl").textContent=error.message;return}
  if(!data.length){$("#bl").textContent="No bookings yet.";return}
  $("#bl").innerHTML=data.map(b=>`<div class="bk"><b>${b.code}</b> · ${b.status.replace("_"," ")}
    <small>${esc(b.listings?.title)} · ${esc(b.vendors?.name)}</small>
    <small>${esc(b.guest_name)} · ${esc(b.guest_email)} · ${b.start_date} · ×${b.quantity}</small>
    <small>Deposit ${b.deposit_mad} MAD (${b.deposit_status}) · Balance ${b.balance_mad} MAD</small>
    <div class="acts"><button data-id="${b.id}" data-s="confirmed">Confirm</button><button data-id="${b.id}" data-s="declined">Decline</button><button data-id="${b.id}" data-s="completed">Done</button></div></div>`).join("");
  $("#bl").querySelectorAll("button").forEach(x=>x.onclick=async()=>{
    await sb.from("bookings").update({status:x.dataset.s,responded_at:new Date().toISOString()}).eq("id",x.dataset.id);loadBookings()});
}
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
enter();
</script>
</body>
</html>
